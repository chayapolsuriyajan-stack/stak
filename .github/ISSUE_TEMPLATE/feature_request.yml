name: Feature request
description: Suggest something stak should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that stak makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've tried
